name: Build & Publish Offline Map Tiles

# 自动切片 + 发布离线地图包到 GitHub Release。
# - 每月 1 号自动跑
# - 也可手动触发(workflow_dispatch),支持选择区域 / 缩放级别
#
# 工作机制:
# 1. 下载指定区域的 OSM PBF
# 2. 用 tilemaker 切成 OpenMapTiles schema 兼容的矢量瓦片(mbtiles)
# 3. 打包 mbtiles + style.json 为 pkg.zip
# 4. 算 SHA-256,生成 manifest.json
# 5. 推 release(tag = 日期)
#
# Android 端:WorkManager 每 7 天后台拉一次 latest manifest,发现新版本就自动下载切槽。

on:
  schedule:
    - cron: '0 4 1 * *'  # 每月 1 号 04:00 UTC(北京时间 12:00)
  workflow_dispatch:
    inputs:
      region:
        description: '区域(默认 shanghai)'
        required: false
        default: 'shanghai'
        type: choice
        options:
          - shanghai
          - beijing
          - guangzhou
          - shenzhen
          - hangzhou
          - chengdu
          - guangdong
          - china
      runner_size:
        description: 'Runner 规格(免费 small / 付费 large,large 需绑卡 + Team 套餐)'
        required: false
        default: 'small'
        type: choice
        options:
          - small
          - large

env:
  REGION: ${{ github.event.inputs.region || 'shanghai' }}
  # tilemaker 二进制版本,跟随官方 release tag
  TILEMAKER_VERSION: v3.0.0

jobs:
  build:
    name: Slice ${{ github.event.inputs.region || 'shanghai' }}
    runs-on: ${{ github.event.inputs.runner_size == 'large' && 'ubuntu-latest-16-cores' || 'ubuntu-latest' }}
    timeout-minutes: 350
    permissions:
      contents: write  # 创建 release 需要

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space (释放预装软件腾出 ~30 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install tools (tilemaker + osmium + zip)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            wget zip jq osmium-tool \
            build-essential cmake \
            lua5.1 liblua5.1-0-dev \
            libsqlite3-dev libshp-dev libboost-all-dev \
            rapidjson-dev libprotobuf-dev protobuf-compiler zlib1g-dev

          # tilemaker:从源码编译(apt 版本太旧不支持新 schema)
          git clone --depth 1 --branch "${TILEMAKER_VERSION}" https://github.com/systemed/tilemaker.git /tmp/tilemaker
          cd /tmp/tilemaker
          make -j$(nproc)
          sudo make install
          tilemaker --help | head -3

      - name: Compute version
        id: version
        run: |
          VERSION=$(date -u +%Y.%m.%d)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASED_AT=$(date -u -Iseconds)" >> $GITHUB_OUTPUT

      - name: Download shapefiles (coastline + Natural Earth landcover)
        run: |
          # tilemaker 的 OpenMapTiles config 引用了 4 个外部 shapefile,
          # tilemaker repo 里不带,必须自己准备。
          # 这一步约 1-3 分钟(都从大文件 CDN 拉)。

          # 1. OSM 海岸线(~800 MB zip,解压后 ~1.5 GB)
          echo "==> Downloading OSM water polygons..."
          mkdir -p coastline
          wget --tries=5 --retry-connrefused --waitretry=15 -q \
            https://osmdata.openstreetmap.de/download/water-polygons-split-4326.zip \
            -O /tmp/coastline.zip
          unzip -q /tmp/coastline.zip -d /tmp/coastline-extract
          # zip 内层目录名是 water-polygons-split-4326/,把 water_polygons.* 五件套搬出来
          find /tmp/coastline-extract -maxdepth 3 -name 'water_polygons.*' -exec mv {} coastline/ \;
          rm -rf /tmp/coastline.zip /tmp/coastline-extract
          ls -lh coastline/

          # 2. Natural Earth 三个 landcover 数据集
          # name:kind 对,kind 是 cultural / physical 分类
          for entry in \
              "ne_10m_urban_areas:cultural" \
              "ne_10m_glaciated_areas:physical" \
              "ne_10m_antarctic_ice_shelves_polys:physical"; do
            NAME="${entry%:*}"
            KIND="${entry##*:}"
            echo "==> Downloading ${NAME} (${KIND})..."
            mkdir -p "landcover/${NAME}"
            # 用 Natural Earth 官方 CDN,多次重试。nvkelso 镜像走 LFS,raw 拉不到,不当 fallback
            wget --tries=5 --retry-connrefused --waitretry=30 --timeout=60 -q \
              "https://naciscdn.org/naturalearth/10m/${KIND}/${NAME}.zip" \
              -O "/tmp/${NAME}.zip"
            # 先解到临时目录,再 find 把五件套(.shp/.dbf/.shx/.prj/.cpg)挪到目标位置
            # 这样无论 zip 内层是平的还是带子目录都对得上 config 引用的相对路径
            mkdir -p "/tmp/${NAME}-extract"
            unzip -q -o "/tmp/${NAME}.zip" -d "/tmp/${NAME}-extract"
            find "/tmp/${NAME}-extract" -name "${NAME}.*" -exec mv {} "landcover/${NAME}/" \;
            rm -rf "/tmp/${NAME}.zip" "/tmp/${NAME}-extract"
            echo "    → $(ls landcover/${NAME}/ | wc -l) files in landcover/${NAME}/"
          done
          echo "==> Landcover layout:"
          ls -la landcover/
          ls -la landcover/ne_10m_urban_areas/

      - name: Compute bbox & download PBF (Geofabrik china-latest)
        run: |
          # 区域 → 边界框(经度 min, 纬度 min, 经度 max, 纬度 max)
          # 全国用大致领土外接矩形,tilemaker 读 shapefile 需要 bbox 来界定海岸线
          case "${REGION}" in
            china)        BBOX="73.0,18.0,135.0,54.0" ;;
            shanghai)     BBOX="120.85,30.67,122.20,31.88" ;;
            beijing)      BBOX="115.42,39.44,117.51,41.06" ;;
            guangzhou)    BBOX="112.95,22.51,114.06,23.93" ;;
            shenzhen)     BBOX="113.75,22.40,114.65,22.87" ;;
            hangzhou)     BBOX="118.34,29.18,120.71,30.57" ;;
            chengdu)      BBOX="103.00,30.10,104.88,31.43" ;;
            guangdong)    BBOX="109.66,20.13,117.19,25.52" ;;
            *)            echo "未知区域: ${REGION}"; exit 1 ;;
          esac

          # 把 BBOX 传到后续 step
          echo "BBOX=${BBOX}" >> $GITHUB_ENV
          echo "Using BBOX: ${BBOX}"

          echo "Downloading china-latest.osm.pbf from Geofabrik..."
          wget --tries=5 --retry-connrefused --waitretry=15 -q \
            https://download.geofabrik.de/asia/china-latest.osm.pbf -O china.osm.pbf
          ls -lh china.osm.pbf

          if [ "${REGION}" = "china" ]; then
            mv china.osm.pbf region.osm.pbf
            echo "全国包,不裁剪"
          else
            echo "Cropping to ${REGION}: bbox=${BBOX}"
            osmium extract -b "${BBOX}" china.osm.pbf -o region.osm.pbf
            rm china.osm.pbf
          fi
          ls -lh region.osm.pbf

      - name: Slice tiles (tilemaker → OpenMapTiles schema)
        run: |
          # tilemaker 必须显式传 --bbox,否则 shapefile 读不进来
          # (Geofabrik PBF 自带的 bbox header tilemaker 不主动读取)
          tilemaker \
            --input region.osm.pbf \
            --output tiles.mbtiles \
            --bbox "${BBOX}" \
            --config /tmp/tilemaker/resources/config-openmaptiles.json \
            --process /tmp/tilemaker/resources/process-openmaptiles.lua
          ls -lh tiles.mbtiles

      - name: Copy style.json from repo
        run: |
          cp app/src/main/assets/maps/style.json style.json
          ls -lh style.json

      - name: Pack pkg.zip + checksum
        id: pack
        run: |
          zip -9 pkg.zip tiles.mbtiles style.json
          SHA256=$(sha256sum pkg.zip | cut -d' ' -f1)
          SIZE=$(stat -c%s pkg.zip)
          echo "SHA256=${SHA256}" >> $GITHUB_OUTPUT
          echo "SIZE=${SIZE}" >> $GITHUB_OUTPUT
          ls -lh pkg.zip
          echo "SHA-256: ${SHA256}"
          echo "Size:    ${SIZE} bytes"

      - name: Generate manifest.json
        run: |
          jq -n \
            --arg ver "${{ steps.version.outputs.VERSION }}" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/pkg.zip" \
            --arg sha "${{ steps.pack.outputs.SHA256 }}" \
            --arg released "${{ steps.version.outputs.RELEASED_AT }}" \
            --arg region "${{ env.REGION }}" \
            --argjson size "${{ steps.pack.outputs.SIZE }}" \
            '{
              latestVersion: $ver,
              minAppVersion: 1,
              packageUrl: $url,
              sizeBytes: $size,
              sha256: $sha,
              releasedAt: $released,
              notes: ("Auto-built " + $region + " tiles")
            }' > manifest.json
          cat manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: 'Map ${{ steps.version.outputs.VERSION }} (${{ env.REGION }})'
          body: |
            自动构建的离线地图包。

            **区域**: ${{ env.REGION }}  ·  **数据源**: Geofabrik china-latest + osmium bbox
            **SHA-256**: `${{ steps.pack.outputs.SHA256 }}`
            **Size**: ${{ steps.pack.outputs.SIZE }} bytes

            车机端 App 在下次后台检查时(7 天周期)会自动下载本版本。
            想立刻看到效果可以在 Settings → 离线地图包 → 点"立即检查"。
          files: |
            pkg.zip
            manifest.json
          fail_on_unmatched_files: true
